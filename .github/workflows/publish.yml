name: Publish
# Публикация в npm при публикации GitHub Release с тегом вида v0.2.0.
# Нужен секрет репозитория NPM_TOKEN (после перехода на trusted publishing — не нужен).
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Тег совпадает с версией в package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then echo "Тег $GITHUB_REF_NAME не совпадает с версией $VERSION в package.json"; exit 1; fi
      - run: npm ci
      - run: npm run check
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
